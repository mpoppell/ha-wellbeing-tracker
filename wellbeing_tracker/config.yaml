name: Wellbeing Tracker
version: "0.15.0"
slug: wellbeing_tracker
image: ghcr.io/mpoppell/{arch}-wellbeing-tracker
description: Track mood, energy, symptoms, medications, sleep and other factors for everyone in your home.
url: https://github.com/mpoppell/ha-wellbeing-tracker
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:heart-pulse
panel_title: Wellbeing
homeassistant_api: true
# To install the companion integration (dashboard card, entities and actions) into
# Home Assistant's custom_components folder. Nothing else in the config folder is touched.
map:
  - type: homeassistant_config
    read_only: false
backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
