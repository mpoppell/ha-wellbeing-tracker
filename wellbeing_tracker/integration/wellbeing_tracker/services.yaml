answer_reminder:
  fields:
    reminder_id:
      required: true
      example: 12
      selector:
        number:
          min: 1
          max: 100000000
          mode: box
    answer:
      required: true
      example: taken
      selector:
        select:
          custom_value: true
          options:
            - taken
            - snooze
            - skip
    reason:
      example: Felt fine
      selector:
        text:

log_dose:
  fields:
    medication:
      required: true
      example: Clonidine
      selector:
        text:
    quantity:
      example: 0.5
      selector:
        number:
          min: 0.25
          max: 100
          step: 0.25
          mode: box
    person:
      example: Matthew Poppell
      selector:
        text:

log:
  fields:
    item:
      required: true
      example: Mood
      selector:
        text:
    value:
      required: true
      example: 8
      selector:
        number:
          min: 0
          max: 10
          mode: box
    person:
      example: Matthew Poppell
      selector:
        text:

im_up:
  fields:
    person:
      example: Matthew Poppell
      selector:
        text:
    at:
      example: "2026-10-23 05:47:00"
      selector:
        datetime:
    source:
      example: phone off charger
      selector:
        text:
