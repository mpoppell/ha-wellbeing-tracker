<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wellbeing</title>
  <link rel="stylesheet" href="static/app.css?v={{v}}">
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="Main">
      <a href="#/checkin" data-tab="checkin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
        <span>Check-in</span>
      </a>
      <a href="#/history" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5.3 10V5m5.4 14v-7M20 19v-4"/></svg>
        <span>History</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="static/app.js?v={{v}}"></script>
</body>
</html>
